<div class="sub-footer">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="sub-footer-inner">
          <ul>
            {{ if hugo.Data.contact.phone }}
            <li><strong>Phone: </strong><a href="tel:{{ replaceRE `[^0-9+]` "" hugo.Data.contact.phone }}">{{ hugo.Data.contact.phone }}</a></li>
            {{ end }}
            {{ if hugo.Data.contact.email }}
            <li><strong>Email: </strong><a href="mailto:{{ hugo.Data.contact.email }}">
                {{ hugo.Data.contact.email }}</a></li>
              {{ end }}
          </ul>
          <ul>
            <li class="zerostatic">© {{ now.Format "2006" }} WILD LLC. All rights reserved.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
