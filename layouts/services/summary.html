<div class="service service-summary wild-{{ mod (sub .Weight 1) 4 }}">
  {{ if .Params.icon }}
  {{/* Decorative (the title beside it names the service), so a CSS background instead of an img with empty alt text */}}
  <div class="service-image" style="background-image: url('{{ .Params.icon | relURL }}')"></div>
  {{ end }}
  <div class="service-content">
    <h2 class="service-title">
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </h2>
    {{ .Content | truncate 120 "..." }}
  </div>
</div>
