# Homepage "What This Looks Like": demonstrations of the services, labeled as examples on the page.
# Not client stories: keep them made-up and typical, and never add numbers that read like results.
- title: 'Missed-call text-back'
  problem: 'A plumber is under a sink when a new customer calls. Normally that call goes to voicemail, and the customer calls the next plumber.'
  steps:
    - 'The missed call triggers a text within seconds: "Sorry we missed you, what can we help with?"'
    - 'The AI asks for the address, the problem and a photo.'
    - 'It offers open times from the calendar and books the visit.'
  result: 'The plumber finishes the job and finds a booked appointment with the details already filled in.'
- title: 'Business visibility check-up'
  problem: 'A bakery wonders why fewer people find it online.'
  steps:
    - 'We search for the bakery the way customers do: Google, Maps, Yelp and AI assistants.'
    - 'We find two different phone numbers, last year''s holiday hours, and an AI assistant that lists the wrong street.'
    - 'We write up what to fix, in order, in plain English.'
  result: 'The owner gets a short report and decides what to fix first.'
  link:
    text: 'See a sample check-up report'
    url: 'sample-check-up/'
- title: 'Automated appointment workflow'
  problem: 'A salon''s front desk spends its mornings confirming bookings and chasing no-shows.'
  steps:
    - 'A booking sends a confirmation text right away.'
    - 'A reminder goes out the day before, with a one-tap link to reschedule.'
    - 'After the visit, a thank-you text asks for a Google review.'
  result: 'The desk only handles the replies that need a person.'
