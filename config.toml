baseURL = "https://glowilds.com/"
locale = "en-US"
enableRobotsTXT = true
# shortcut: sitemap dates come from each page's own file; the homepage, About, How It Works and Contact pull text from other files, so edit their own file too if their date should move
enableGitInfo = true
disableKinds = ["taxonomy", "term"]
title = "Glow Wild"
theme = "hugo-hero-theme"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.158.0"

[params]
  # setting this adds Google Analytics cookies: update content/privacy.md first
  google_analytics_id = ""

  [params.logo]
    mobile = "images/logo-mobile.svg"
    mobile_height = "36px"
    mobile_width = "45px"
    desktop = "images/logo.svg"
    desktop_height = "36px"
    desktop_width = "210px"
    alt = "Glow Wild"


[[menu.main]]
  name = "Services"
  url = "/services/"
  weight = 1

[[menu.main]]
  name = "Who We Help"
  url = "/work/"
  weight = 2

[[menu.main]]
  name = "How It Works"
  url = "/process/"
  weight = 3

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 5

# llms.txt: a plain-text summary of the site for AI assistants, built from layouts/home.llms.txt
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss", "llms"]

[permalinks]
  pages = "/:filename/"
